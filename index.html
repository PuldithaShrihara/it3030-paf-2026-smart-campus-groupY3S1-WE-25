<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmartCampusHub — Live Demo</title>
<style>
/* ===== RESET & BASE ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#4f46e5;--primary-dark:#3730a3;--primary-light:#e0e7ff;
  --accent:#06b6d4;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;
  --bg:#f8fafc;--card:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;
  --sidebar-w:240px;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.06);
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font:inherit;border:none;outline:none}
input,select,textarea{font:inherit;border:1px solid var(--border);border-radius:8px;padding:8px 12px;width:100%;outline:none;transition:border .2s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
textarea{resize:vertical;min-height:80px}
</style>

<!-- ===== LAYOUT ===== -->
<style>
#app{display:flex;min-height:100vh}
/* ---- AUTH SCREENS ---- */
.auth-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;width:100%;background:linear-gradient(135deg,#4f46e5 0%,#06b6d4 100%)}
.auth-card{background:#fff;border-radius:20px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.auth-card .logo{font-size:1.7rem;font-weight:800;color:var(--primary);margin-bottom:4px}
.auth-card .subtitle{color:var(--muted);font-size:.9rem;margin-bottom:28px}
.auth-card h2{font-size:1.4rem;font-weight:700;margin-bottom:20px}
.role-tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.role-tab{padding:7px 16px;border-radius:20px;border:2px solid var(--border);font-size:.82rem;font-weight:600;background:#fff;color:var(--muted);transition:.2s}
.role-tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.82rem;font-weight:600;color:var(--text);margin-bottom:6px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:8px;font-weight:600;font-size:.9rem;transition:.2s;justify-content:center}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-success{background:var(--success);color:#fff}
.btn-warning{background:var(--warning);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:#fff;border:2px solid var(--primary);color:var(--primary)}
.btn-outline:hover{background:var(--primary-light)}
.btn-sm{padding:6px 12px;font-size:.8rem}
.btn-full{width:100%}
.otp-hint{background:var(--primary-light);border-radius:8px;padding:10px 14px;font-size:.82rem;color:var(--primary-dark);margin-bottom:16px}
.divider{text-align:center;color:var(--muted);font-size:.82rem;margin:16px 0;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:var(--border)}
.divider::before{left:0}.divider::after{right:0}
.google-btn{background:#fff;border:2px solid var(--border);color:var(--text);display:flex;align-items:center;gap:10px;justify-content:center;padding:10px;border-radius:8px;font-weight:600;width:100%;cursor:pointer;transition:.2s}
.google-btn:hover{border-color:var(--primary);background:var(--primary-light)}
.switch-link{text-align:center;font-size:.85rem;color:var(--muted);margin-top:18px}
.switch-link span{color:var(--primary);cursor:pointer;font-weight:600}
</style>

<!-- ===== DASHBOARD LAYOUT ===== -->
<style>
.sidebar{width:var(--sidebar-w);background:#1e1b4b;min-height:100vh;display:flex;flex-direction:column;position:fixed;left:0;top:0;z-index:100;transition:.3s}
.sidebar-logo{padding:22px 20px 14px;font-size:1.1rem;font-weight:800;color:#fff;letter-spacing:.5px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-logo span{color:#a5b4fc}
.sidebar-user{padding:14px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:.85rem;flex-shrink:0}
.avatar.lg{width:56px;height:56px;font-size:1.1rem}
.sidebar-user-info{overflow:hidden}
.sidebar-user-info .name{color:#fff;font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-user-info .role-badge{display:inline-block;background:rgba(165,180,252,.18);color:#a5b4fc;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:10px;margin-top:2px}
.sidebar-nav{padding:12px 10px;flex:1}
.nav-section{margin-bottom:6px}
.nav-section-label{color:rgba(255,255,255,.35);font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:8px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:rgba(255,255,255,.65);font-size:.88rem;font-weight:500;cursor:pointer;transition:.15s;margin-bottom:2px}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:rgba(165,180,252,.18);color:#a5b4fc;font-weight:600}
.nav-item .icon{font-size:1rem;width:18px;text-align:center}
.nav-item .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:.65rem;font-weight:700;padding:2px 6px;border-radius:10px}
.sidebar-footer{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08)}
.logout-btn{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.5);font-size:.85rem;cursor:pointer;padding:8px 10px;border-radius:8px;transition:.15s;background:none;border:none;width:100%}
.logout-btn:hover{background:rgba(239,68,68,.15);color:#fca5a5}
.main-content{margin-left:var(--sidebar-w);flex:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-weight:700;font-size:1.05rem;color:var(--text)}
.topbar-actions{display:flex;align-items:center;gap:12px}
.notif-btn{position:relative;width:36px;height:36px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
.notif-btn:hover{background:var(--primary-light);border-color:var(--primary)}
.notif-badge{position:absolute;top:-2px;right:-2px;background:var(--danger);color:#fff;font-size:.6rem;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.page-content{padding:24px;flex:1}
</style>

<!-- ===== COMPONENTS ===== -->
<style>
/* Cards & Stats */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border-left:4px solid transparent;display:flex;align-items:center;gap:14px}
.stat-card.blue{border-color:#4f46e5}.stat-card.green{border-color:#10b981}.stat-card.amber{border-color:#f59e0b}.stat-card.red{border-color:#ef4444}.stat-card.cyan{border-color:#06b6d4}
.stat-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0}
.stat-card.blue .stat-icon{background:#e0e7ff}.stat-card.green .stat-icon{background:#d1fae5}.stat-card.amber .stat-icon{background:#fef3c7}.stat-card.red .stat-icon{background:#fee2e2}.stat-card.cyan .stat-icon{background:#cffafe}
.stat-info .val{font-size:1.6rem;font-weight:800;line-height:1}
.stat-info .lbl{font-size:.8rem;color:var(--muted);margin-top:3px}
/* Section header */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-header h3{font-size:1rem;font-weight:700}
/* Table */
.table-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{background:#f8fafc;padding:11px 14px;text-align:left;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:1px solid var(--border)}
td{padding:12px 14px;font-size:.88rem;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8fafc}
/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700;text-transform:uppercase}
.badge-pending{background:#fef3c7;color:#b45309}
.badge-approved{background:#d1fae5;color:#065f46}
.badge-checked_in{background:#cffafe;color:#0e7490}
.badge-rejected{background:#fee2e2;color:#991b1b}
.badge-cancelled{background:#f3f4f6;color:#6b7280}
.badge-open{background:#dbeafe;color:#1e40af}
.badge-in_progress{background:#ede9fe;color:#6d28d9}
.badge-resolved{background:#d1fae5;color:#065f46}
.badge-active{background:#d1fae5;color:#065f46}
.badge-maintenance{background:#fef3c7;color:#b45309}
.badge-student{background:#e0e7ff;color:#3730a3}
.badge-admin{background:#fce7f3;color:#9d174d}
.badge-technician{background:#d1fae5;color:#065f46}
.badge-superadmin{background:#fef3c7;color:#92400e}
/* Resource grid */
.resource-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.resource-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:.2s}
.resource-card:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,.1)}
.resource-img{height:130px;background:linear-gradient(135deg,#4f46e5 0%,#06b6d4 100%);display:flex;align-items:center;justify-content:center;font-size:2.5rem}
.resource-body{padding:14px}
.resource-body h4{font-size:.95rem;font-weight:700;margin-bottom:4px}
.resource-body .loc{font-size:.8rem;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:4px}
.resource-body .cap{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--text)}
.resource-footer{padding:10px 14px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.25)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-header h3{font-size:1.1rem;font-weight:700}
.modal-close{background:none;border:none;font-size:1.3rem;color:var(--muted);cursor:pointer;line-height:1}
.modal-close:hover{color:var(--danger)}
/* Toast */
.toast-container{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:9999}
.toast{background:#1e1b4b;color:#fff;padding:12px 18px;border-radius:10px;font-size:.88rem;box-shadow:0 4px 20px rgba(0,0,0,.2);display:flex;align-items:center;gap:10px;animation:slideIn .3s ease;max-width:320px}
.toast.success{background:#065f46}.toast.error{background:#991b1b}.toast.warning{background:#92400e}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
/* Charts */
.chart-bar-wrap{display:flex;align-items:flex-end;gap:8px;height:100px;margin-top:8px}
.chart-bar{flex:1;background:var(--primary);border-radius:4px 4px 0 0;position:relative;transition:height .4s ease;min-width:20px}
.chart-bar:hover{opacity:.8}
.chart-bar .tip{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:.7rem;font-weight:700;color:var(--primary-dark);white-space:nowrap}
.chart-bar-label{font-size:.65rem;color:var(--muted);text-align:center;margin-top:4px}
.chart-row{display:flex;flex-direction:column}
/* Notif panel */
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);flex-shrink:0;margin-top:3px}
/* Tabs */
.tabs{display:flex;gap:4px;background:#f1f5f9;border-radius:10px;padding:4px;margin-bottom:20px}
.tab{flex:1;padding:8px;text-align:center;border-radius:8px;font-size:.85rem;font-weight:600;color:var(--muted);cursor:pointer;transition:.2s}
.tab.active{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.08)}
/* Alert */
.alert{padding:12px 16px;border-radius:10px;font-size:.88rem;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px}
.alert-info{background:var(--primary-light);color:var(--primary-dark)}
.alert-success{background:#d1fae5;color:#065f46}
.alert-warning{background:#fef3c7;color:#92400e}
</style>

<!-- ===== EXTRA STYLES ===== -->
<style>
/* Public landing */
.landing{min-height:100vh;background:#fff}
.landing-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 40px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:100}
.landing-nav .logo{font-size:1.2rem;font-weight:800;color:var(--primary)}
.landing-nav .logo span{color:var(--accent)}
.nav-links{display:flex;gap:8px}
.hero{padding:80px 40px 60px;text-align:center;background:linear-gradient(135deg,#f0f4ff 0%,#e0f2fe 100%)}
.hero h1{font-size:2.8rem;font-weight:900;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:16px}
.hero p{font-size:1.1rem;color:var(--muted);max-width:560px;margin:0 auto 32px}
.hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px;padding:60px 40px}
.feature-item{text-align:center;padding:28px 20px;border-radius:16px;background:#fff;border:1px solid var(--border);transition:.2s}
.feature-item:hover{border-color:var(--primary);box-shadow:0 4px 20px rgba(79,70,229,.12)}
.feature-icon{font-size:2.2rem;margin-bottom:14px}
.feature-item h3{font-weight:700;margin-bottom:8px}
.feature-item p{font-size:.88rem;color:var(--muted)}
.role-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;padding:0 40px 60px}
.role-card{padding:24px;border-radius:16px;text-align:center;border:2px solid var(--border);cursor:pointer;transition:.2s}
.role-card:hover{border-color:var(--primary);transform:translateY(-2px)}
.role-card .role-icon{font-size:2rem;margin-bottom:10px}
.role-card h4{font-weight:700;margin-bottom:6px}
.role-card p{font-size:.8rem;color:var(--muted)}
/* Responsive */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .main-content{margin-left:0}
  .stat-grid{grid-template-columns:1fr 1fr}
  .hero h1{font-size:2rem}
  .hero{padding:50px 20px 40px}
  .feature-grid,.role-grid{padding:30px 20px}
  .landing-nav{padding:12px 20px}
}
.hidden{display:none!important}
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}.gap-2{gap:8px}.gap-3{gap:12px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mb-3{margin-bottom:12px}.text-muted{color:var(--muted)}.text-sm{font-size:.85rem}.fw-600{font-weight:600}.fw-700{font-weight:700}
/* Timeline */
.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:14px;padding-bottom:18px;position:relative}
.tl-item:not(:last-child)::before{content:'';position:absolute;left:15px;top:30px;bottom:0;width:2px;background:var(--border)}
.tl-dot{width:32px;height:32px;border-radius:50%;background:var(--primary-light);border:2px solid var(--primary);display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0;z-index:1}
.tl-body{flex:1}
.tl-body .tl-title{font-weight:600;font-size:.9rem}
.tl-body .tl-sub{font-size:.8rem;color:var(--muted)}
/* Filter bar */
.filter-bar{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:20px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.filter-bar .form-group{margin:0;min-width:140px;flex:1}
/* QR code visual */
.qr-box{width:160px;height:160px;background:#fff;border:2px solid var(--border);border-radius:12px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative;overflow:hidden}
.qr-inner{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;width:120px;height:120px}
.qr-cell{border-radius:1px}
/* Progress bar */
.progress{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin-top:6px}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:4px;transition:width .5s ease}
</style>

</head>
<body>

<div id="app"></div>
<div class="toast-container" id="toastContainer"></div>

<!-- ====== MODALS ====== -->
<!-- Booking Modal -->
<div class="modal-overlay" id="bookingModal">
<div class="modal">
  <div class="modal-header">
    <h3>📅 Create Booking</h3>
    <button class="modal-close" onclick="closeModal('bookingModal')">✕</button>
  </div>
  <div class="form-group"><label>Resource</label>
    <select id="bkResource">
      <option>Main Lecture Hall (A101)</option><option>Science Lab 2</option>
      <option>Meeting Room B</option><option>Projector (x1)</option>
    </select></div>
  <div class="form-group"><label>Booking Type</label>
    <select><option>Space</option><option>Equipment</option></select></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <div class="form-group"><label>Date</label><input type="date" value="2026-07-18" /></div>
    <div class="form-group"><label>Start Time</label><input type="time" value="09:00" /></div>
    <div class="form-group"><label>End Time</label><input type="time" value="11:00" /></div>
    <div class="form-group"><label>Attendees</label><input type="number" value="25" /></div>
  </div>
  <div class="form-group"><label>Purpose</label><input type="text" value="Group project presentation" /></div>
  <div class="form-group"><label>Notes</label><textarea>Please ensure projector is available.</textarea></div>
  <button class="btn btn-primary btn-full" onclick="submitBooking()">Submit Booking Request</button>
</div></div>

<!-- Incident Modal -->
<div class="modal-overlay" id="incidentModal">
<div class="modal">
  <div class="modal-header">
    <h3>🎫 Report Incident</h3>
    <button class="modal-close" onclick="closeModal('incidentModal')">✕</button>
  </div>
  <div class="form-group"><label>Title</label><input type="text" id="incTitle" value="Projector not working in A101" /></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <div class="form-group"><label>Category</label>
      <select><option>Equipment Failure</option><option>Infrastructure</option><option>Safety</option></select></div>
    <div class="form-group"><label>Priority</label>
      <select><option>HIGH</option><option>MEDIUM</option><option>LOW</option></select></div>
  </div>
  <div class="form-group"><label>Related Resource</label>
    <select><option>Main Lecture Hall (A101)</option><option>Science Lab 2</option></select></div>
  <div class="form-group"><label>Description</label><textarea>The ceiling-mounted projector in A101 fails to display after warm-up. Lamp may need replacement.</textarea></div>
  <div class="form-group"><label>Preferred Contact Email</label><input type="email" value="student@campus.edu" /></div>
  <button class="btn btn-primary btn-full" onclick="submitIncident()">Submit Incident</button>
</div></div>

<!-- Notification Panel -->
<div class="modal-overlay" id="notifPanel">
<div class="modal" style="max-width:400px">
  <div class="modal-header">
    <h3>🔔 Notifications</h3>
    <button class="modal-close" onclick="closeModal('notifPanel')">✕</button>
  </div>
  <div id="notifList"></div>
  <button class="btn btn-outline btn-full mt-2" style="font-size:.82rem" onclick="markAllRead()">Mark all as read</button>
</div></div>

<script>

const DATA = {

    {id:'u4',name:'Akeeth Ahamed',email:'akeeth@campus.edu',role:'TECHNICIAN',verified:true,lastLogin:'2026-07-14',avatar:'AA'},

  state.view = view;

  if(opts.user) state.user = opts.user;
  if(opts.page) state.page = opts.page;
  render();
}

  state.page = p;

}

function logout() {

        <div style="font-size:.9rem;${n.read?'':'font-weight:600'}">${n.msg}</div>
        <div class="text-muted text-sm mt-2">${n.time}</div>
      </div>
      ${!n.read?`<div class="notif-dot"></div>`:''}
    </div>`).join('')}
  </div>`;
}

function renderCalendarPage() {

  const events = [
    {day:0,title:'Projector repair - A101',color:'#ef4444'},

    {day:4,title:'Door lock - C105',color:'#10b981'},

  return `
  <div class="table-wrap" style="padding:20px">
    <div class="flex justify-between items-center mb-3">
      <h3>July 2026</h3>
      <div class="flex gap-2">
        <button class="btn btn-outline btn-sm">← Prev</button>
        <button class="btn btn-outline btn-sm">Next →</button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px">
      ${days.map(d=>`<div style="text-align:center;font-size:.75rem;font-weight:700;color:var(--muted);padding:8px">${d}</div>`).join('')}
      ${dates.map((d,i)=>{
        const ev = events.find(e=>e.day===i);

        </div>`;
      }).join('')}

</script>

<script>
// ===== HELPERS =====
function statusBadge(s) {
  const cls = s.toLowerCase().replace(' ','_');
  return `<span class="badge badge-${cls}">${s.replace('_',' ')}</span>`;
}
function roleBadge(r) {
  return `<span class="badge badge-${r.toLowerCase()}">${r}</span>`;
}

function renderBarChart(vals, labels, color) {
  const max = Math.max(...vals);
  return `
  <div>
    <div class="chart-bar-wrap">
      ${vals.map((v,i)=>`
      <div class="chart-row" style="flex:1">
        <div class="chart-bar" style="height:${Math.round(v/max*90)+10}px;background:${color}" title="${v}">
          <span class="tip">${v}</span>
        </div>
        <div class="chart-bar-label">${labels[i]}</div>
      </div>`).join('')}
    </div>
  </div>`;
}

// ===== ACTIONS =====
function approveBooking(id) {
  const b = DATA.bookings.find(x=>x.id===id);
  if(b){ b.status='APPROVED'; b.qr=true; }
  render();
  toast(`Booking approved! QR code generated ✅`, 'success');
}

function rejectBooking(id) {
  const b = DATA.bookings.find(x=>x.id===id);
  if(b) b.status='REJECTED';
  render();
  toast('Booking rejected. Student notified.', 'error');
}

function cancelBooking(id) {
  const b = DATA.bookings.find(x=>x.id===id);
  if(b) b.status='CANCELLED';
  render();
  toast('Booking cancelled.', 'warning');
}

function assignIncident(id) {
  const inc = DATA.incidents.find(i=>i.id===id);
  if(inc){ inc.assigned='Akeeth Ahamed'; inc.assignStatus='ACCEPTED'; inc.status='IN_PROGRESS'; }
  render();
  toast('Incident assigned to Akeeth Ahamed 🛠️', 'success');
}

function resolveIncident(id) {
  const inc = DATA.incidents.find(i=>i.id===id);
  if(inc){ inc.status='RESOLVED'; }
  render();
  toast('Incident marked as resolved ✅', 'success');
}

function submitBooking() {
  closeModal('bookingModal');
  DATA.bookings.unshift({
    id:'b_new',user:state.user.name,resource:'Main Lecture Hall (A101)',
    date:'2026-07-18',start:'09:00',end:'11:00',
    purpose:'Group project presentation',attendees:25,status:'PENDING',qr:false
  });
  toast('Booking request submitted! Awaiting admin approval. ⏳', 'success');
}

function submitIncident() {
  closeModal('incidentModal');
  DATA.incidents.unshift({
    id:'i_new',title:'Projector not working in A101',category:'Equipment Failure',
    priority:'HIGH',resource:'Main Lecture Hall (A101)',reporter:state.user.name,
    status:'OPEN',assigned:null,assignStatus:'UNASSIGNED',created:'2026-07-14'
  });
  toast('Incident reported! Reference #INC-0' + (DATA.incidents.length) + ' 🎫', 'success');
}

function showQR(bookingId) {
  const b = DATA.bookings.find(x=>x.id===bookingId);
  // Build fake QR visual
  const cells = Array.from({length:64},()=>Math.random()>0.5?1:0);
  const qrHtml = cells.map(c=>`<div class="qr-cell" style="background:${c?'#000':'#fff'}"></div>`).join('');
  const modal = document.getElementById('bookingModal');
  modal.querySelector('.modal').innerHTML = `
    <div class="modal-header"><h3>🔳 Booking QR Code</h3><button class="modal-close" onclick="closeModal('bookingModal')">✕</button></div>
    <div style="text-align:center">
      <div class="qr-box"><div class="qr-inner">${qrHtml}</div></div>
      <p class="text-muted text-sm mt-2">${b?b.resource:'Resource'}</p>
      <p class="text-sm mt-2"><strong>${b?b.date:''}</strong> · ${b?b.start:''}–${b?b.end:''}</p>
      <div class="badge badge-approved mt-2" style="font-size:.85rem">APPROVED</div>
      <p class="text-muted text-sm mt-2">Show this QR code at the entrance for check-in</p>
      <button class="btn btn-primary mt-2" onclick="closeModal('bookingModal')">Close</button>
    </div>`;
  openModal('bookingModal');
}

function simulateScan() {
  setTimeout(()=>{ toast('QR scanned! Booking verified ✅ — Dinusha Shashini checked in to Main Lecture Hall', 'success'); },1000);
  toast('Camera started... scanning...', 'info');
}

function manualCheckIn() {
  const token = document.getElementById('qrToken')?.value;
  if(token) {
    toast(`Booking verified ✅ — Token: ${token.substring(0,12)}... Check-in successful!`, 'success');
  } else {
    toast('Please enter a QR token to verify', 'warning');
  }
}

function markAllRead() {
  DATA.notifications.forEach(n=>n.read=true);
  state.unreadCount = 0;
  closeModal('notifPanel');
  render();
  toast('All notifications marked as read', 'success');
}

// ===== MODAL HELPERS =====
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function openNotifPanel() {
  const list = document.getElementById('notifList');
  if(list) {
    list.innerHTML = DATA.notifications.map(n=>`
    <div style="padding:12px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start;background:${n.read?'#fff':'#f0f4ff'}">
      <span style="font-size:1.1rem">${n.type==='BOOKING'?'📅':n.type==='TICKET'?'🎫':n.type==='REMINDER'?'⏰':'📢'}</span>
      <div>
        <div style="font-size:.85rem;${n.read?'':'font-weight:600'}">${n.msg}</div>
        <div class="text-muted" style="font-size:.75rem;margin-top:4px">${n.time}</div>
      </div>
      ${!n.read?`<div class="notif-dot" style="margin-left:auto"></div>`:''}
    </div>`).join('');
  }
  openModal('notifPanel');
}

// ===== TOAST =====
function toast(msg, type='info') {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type==='success'?'success':type==='error'?'error':type==='warning'?'warning':''}`;
  el.innerHTML = `<span>${type==='success'?'✅':type==='error'?'❌':type==='warning'?'⚠️':'ℹ️'}</span><span>${msg}</span>`;
  container.appendChild(el);
  setTimeout(()=>el.remove(), 4000);
}

// Close modals on overlay click
document.querySelectorAll('.modal-overlay').forEach(o=>{
  o.addEventListener('click', e => { if(e.target===o) o.classList.remove('open'); });
});

// ===== INIT =====
render();
</script>
